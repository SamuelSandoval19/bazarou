<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head-meta}"></th:block>
    <title>Editar perfil — Bazarou</title>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="publish-wrap">
    <div class="publish-card">
        <h1>Editar <em>perfil</em></h1>
        <p class="lead">Actualiza tu información para que los compradores te conozcan mejor.</p>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/perfil/editar}" method="post" th:object="${usuario}">

            <div class="form-group">
                <label>Nombre completo</label>
                <input type="text" th:field="*{nombreCompleto}" placeholder="Mariana Pérez">
            </div>

            <div class="form-group">
                <label>Bio (cuéntanos algo sobre ti)</label>
                <textarea th:field="*{bio}" placeholder="Vendo cosas únicas que ya no uso. Soy buena onda y entrego rápido."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ciudad</label>
                    <input type="text" th:field="*{ciudad}" placeholder="CDMX">
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <input type="text" th:field="*{estado}" placeholder="Jalisco">
                </div>
            </div>

            <div class="form-group">
                <label>Teléfono (no se mostrará público)</label>
                <input type="text" th:field="*{telefono}" placeholder="55 1234 5678">
            </div>

            <button type="submit" class="btn-block">Guardar cambios</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
