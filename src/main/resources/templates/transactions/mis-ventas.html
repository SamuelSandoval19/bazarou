<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head-meta}"></th:block>
    <title>Mis ventas — Bazarou</title>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="list-wrap">
    <div class="list-header">
        <h1>💰 Mis ventas</h1>
        <a href="/compra/mis-compras" class="btn-secondary" style="padding:10px 18px; font-size:14px;">Ver mis compras</a>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div th:if="${transacciones.empty}" class="empty-state">
        <div class="emoji">📦</div>
        <h3>Aún no tienes ventas</h3>
        <p>Cuando alguien compre algo tuyo, aparecerá aquí.</p>
        <a href="/vender" class="btn-primary" style="margin-top: 24px;">Publicar producto</a>
    </div>

    <div th:unless="${transacciones.empty}" style="background: var(--papel); border-radius: var(--radio); border: 1px solid var(--linea); overflow-x: auto;">
        <table class="tabla-transacciones">
            <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Comprador</th>
                <th>Recibirás</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${transacciones}">
                <td><code th:text="${t.codigoSeguimiento}">BZR-2025-XXX</code></td>
                <td>
                    <a th:href="@{|/producto/${t.producto.id}|}" style="font-weight: 500;" th:text="${t.producto.titulo}">Producto</a>
                </td>
                <td>@<span th:text="${t.comprador.username}">comprador</span></td>
                <td>$<span th:text="${#numbers.formatDecimal(t.monto.subtract(t.comisionBazarou), 0, 'COMMA', 2, 'POINT')}">0</span></td>
                <td>
                    <span class="estado-badge" th:classappend="'estado-' + ${t.estado.name()}" th:text="${t.estado.name()}">--</span>
                </td>
                <td>
                    <details th:if="${t.estado.name() == 'PAGO_RETENIDO'}">
                        <summary style="cursor: pointer; color: var(--rosa-mexicano); font-weight: 600; font-size: 13px;">Marcar enviado</summary>
                        <form th:action="@{|/compra/${t.id}/enviar|}" method="post" style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
                            <input type="text" name="paqueteria" placeholder="Paquetería (ej. Estafeta)" required style="padding: 6px 10px; font-size: 12px; border: 1px solid var(--linea); border-radius: 6px;">
                            <input type="text" name="guia" placeholder="Núm. de guía" required style="padding: 6px 10px; font-size: 12px; border: 1px solid var(--linea); border-radius: 6px;">
                            <button type="submit" class="btn-primary" style="padding: 6px 14px; font-size: 12px;">Confirmar envío</button>
                        </form>
                    </details>
                    <span th:if="${t.estado.name() == 'ENVIADO'}" style="font-size: 12px; color: var(--gris);">
                        📦 <span th:text="${t.paqueteria}">--</span> · <code th:text="${t.guiaEnvio}">--</code>
                    </span>
                    <span th:if="${t.estado.name() == 'COMPLETADO'}" style="font-size: 12px; color: var(--talavera);">✅ Pagado</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
