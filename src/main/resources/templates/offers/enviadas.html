<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head-meta}"></th:block>
    <title>Mis ofertas — Bazarou</title>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="list-wrap">
    <div class="list-header">
        <h1>💬 Mis ofertas enviadas</h1>
        <a href="/ofertas/recibidas" class="btn-secondary" style="padding:10px 18px; font-size:14px;">Ver ofertas recibidas</a>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div th:if="${ofertas.empty}" class="empty-state">
        <div class="emoji">🤝</div>
        <h3>Aún no has hecho ninguna oferta</h3>
        <p>Encuentra algo que te guste y échate un regateo.</p>
        <a href="/buscar" class="btn-primary" style="margin-top: 24px;">Explorar el bazar</a>
    </div>

    <div th:unless="${ofertas.empty}" style="display: flex; flex-direction: column; gap: 16px;">
        <div th:each="o : ${ofertas}" style="background: var(--papel); border-radius: var(--radio); padding: 20px; border: 1px solid var(--linea); display: grid; grid-template-columns: 80px 1fr auto; gap: 20px; align-items: center;">

            <a th:href="@{|/producto/${o.producto.id}|}">
                <div style="width: 80px; height: 80px; border-radius: var(--radio-sm); overflow: hidden; background: var(--crema);">
                    <img th:if="${!o.producto.imagenes.isEmpty()}" th:src="${o.producto.imagenes[0]}" alt="" style="width:100%; height:100%; object-fit:cover;">
                </div>
            </a>

            <div>
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 4px;">
                    <a th:href="@{|/producto/${o.producto.id}|}" style="font-weight: 600; font-size: 16px;" th:text="${o.producto.titulo}">Producto</a>
                    <span class="estado-badge" th:classappend="'estado-' + ${o.estado.name()}" th:text="${o.estado.name()}">PENDIENTE</span>
                </div>
                <div style="color: var(--gris); font-size: 14px;">
                    Vendedor: <strong>@<span th:text="${o.producto.vendedor.username}">user</span></strong>
                    · Tu oferta:
                    <strong style="color: var(--rosa-mexicano); font-family: var(--display); font-size: 18px;">$<span th:text="${#numbers.formatDecimal(o.montoOfrecido, 0, 'COMMA', 2, 'POINT')}">0</span></strong>
                </div>
                <p th:if="${o.respuestaVendedor != null and !o.respuestaVendedor.isEmpty()}"
                   style="margin-top: 8px; padding: 10px 14px; background: var(--rosa-mexicano-soft); border-radius: var(--radio-sm); font-size: 14px;">
                    💬 Vendedor: <span th:text="${o.respuestaVendedor}">--</span>
                </p>
                <div style="font-size: 12px; color: var(--gris); margin-top: 6px;" th:text="'Enviada: ' + ${#temporals.format(o.fechaOferta, 'dd MMM yyyy, HH:mm')}">Fecha</div>
            </div>

            <div th:if="${o.estado.name() == 'ACEPTADA'}">
                <a th:href="@{|/compra/checkout/${o.producto.id}|}" class="btn-primary" style="padding: 10px 20px; font-size: 14px;">🛒 Comprar</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
