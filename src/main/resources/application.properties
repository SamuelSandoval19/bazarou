# ============================================
# BAZAROU - Configuración principal
# ============================================

# --- Servidor ---
server.port=8080
spring.application.name=Bazarou

# --- Conexión a MySQL de XAMPP ---
# XAMPP por defecto: usuario 'root', sin contraseña, puerto 3306
# Crea la base de datos 'bazarou' en phpMyAdmin antes de arrancar (o usa el script en /database/schema.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/bazarou?useSSL=false&serverTimezone=America/Mexico_City&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' crea las tablas automáticamente la primera vez y mantiene los datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Carga de datos iniciales (categorías, etc.) ---
spring.sql.init.mode=never

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- Subida de imágenes ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Carpeta donde se guardan las imágenes subidas
bazarou.uploads.dir=./uploads

# --- Logs ---
logging.level.com.bazarou=DEBUG
logging.level.org.springframework.security=INFO
