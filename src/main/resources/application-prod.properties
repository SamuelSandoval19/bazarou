# ============================================
# BAZAROU - Perfil de PRODUCCION (Render + PostgreSQL)
# ============================================

server.port=${PORT:8080}
spring.application.name=Bazarou

# --- PostgreSQL en Render ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate para PostgreSQL ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Las categorias se cargan via DataInitializer.java (no via data.sql)
spring.sql.init.mode=never

# --- Thymeleaf en produccion (cache habilitado) ---
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- Subida de imagenes ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# En Render free tier el filesystem es efimero, las imagenes se pierden al redesplegar
bazarou.uploads.dir=/tmp/uploads

# --- Logs ---
logging.level.com.bazarou=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
